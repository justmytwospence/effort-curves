[package]
name = "effort_curves"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
name = "effort_curves"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py311"] }
numpy = "0.25"
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
